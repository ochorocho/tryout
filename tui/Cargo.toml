[package]
name = "tryout"
version = "0.5.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# use-dev-tty: `ddev tryout ui` hands us /dev/tty (a host command gets pipes on
# stdin/stdout), and on macOS kqueue cannot poll /dev/tty — without it the TUI
# dies with "Failed to initialize input reader".
crossterm = { version = "0.29.0", features = ["serde", "use-dev-tty"] }
inquire = "0.9.4"
libc = "0.2.189"
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tui-term = "0.3.4"
ureq = "3"
vt100 = "0.16.2"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

# Three of these are committed into every release (tryout/bin/), so size counts.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
