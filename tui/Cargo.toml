[package]
name = "tryout-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# use-dev-tty: `ddev tryout ui` hands us /dev/tty (a host command gets pipes on
# stdin/stdout), and on macOS kqueue cannot poll /dev/tty — without it the TUI
# dies with "Failed to initialize input reader".
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tui-term = "0.3.4"
vt100 = "0.16.2"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
