#ddev-generated
# Generated by ddev tryout worktree serve --db — do not edit.
# The database servers served sites run on besides the project's own.

services:
  tryout-mysql:
    container_name: ddev-${DDEV_SITENAME}-tryout-mysql
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: db
      MYSQL_PASSWORD: db
      MYSQL_DATABASE: db
    volumes:
      - tryout-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-proot"]
      interval: 2s
      retries: 60
  tryout-postgres:
    container_name: ddev-${DDEV_SITENAME}-tryout-postgres
    image: postgres:17
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      POSTGRES_USER: db
      POSTGRES_PASSWORD: db
      POSTGRES_DB: db
    volumes:
      - tryout-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db"]
      interval: 2s
      retries: 60

volumes:
  tryout-mysql:
    name: ddev-${DDEV_SITENAME}-tryout-mysql
  tryout-postgres:
    name: ddev-${DDEV_SITENAME}-tryout-postgres
