# Generated by ddev tryout worktree serve v13 — edits will be overwritten.
<VirtualHost *:80 *:443>
    ServerName v13.parity.ddev.site
    DocumentRoot /var/www/html/TYPO3-Instances/v13/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/master.crt
    SSLCertificateKeyFile /etc/ssl/certs/master.key

    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    SetEnv TRYOUT_SITE v13
    SetEnv TYPO3_DB_DBNAME db_v13

    <Directory "/var/www/html/TYPO3-Instances/v13/public/">
        AllowOverride All
        Require all granted
    </Directory>

    # Overrides the global conf-enabled/php*-fpm.conf handler: sites-enabled is
    # read later and a FilesMatch inside a VirtualHost is more specific.
    <FilesMatch ".+\.ph(?:ar|p|tml)$">
        SetHandler "proxy:unix:/run/php/php-fpm-8.2.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog /dev/stdout
    CustomLog /dev/stdout combined
</VirtualHost>
