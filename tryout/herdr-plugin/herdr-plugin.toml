#ddev-generated
id = "tryout.worktree-guard"
name = "tryout worktree guard"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Keeps TYPO3 Core worktrees inside the DDEV project"
platforms = ["linux", "macos"]

# herdr's built-in "New worktree" checks out under worktrees.directory as
# <repo>/<branch-slug>, which no ddev tryout command can see. That action cannot be
# redirected (worktrees.directory is its only setting and the layout below it is
# fixed) and there is no pre-create hook, so the checkout is relocated after the fact.
[[events]]
on = "worktree.created"
command = ["bash", "relocate.sh"]
