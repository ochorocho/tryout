name: tui
# Checks the terminal UI in tui/. Its release binaries are built by
# tui-release.yml; this only proves every change still builds, lints and tests
# on both platforms it ships for.
on:
  pull_request:
    paths: [ "tui/**", ".github/workflows/tui*.yml" ]
  push:
    branches: [ main ]
    paths: [ "tui/**", ".github/workflows/tui*.yml" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tui

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tui
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The PTY tests spawn /bin/sh on a real pseudo-terminal: both runners have one.
      - run: cargo test
