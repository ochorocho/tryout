# Build the documentation (VitePress, in docs/) and publish it to GitHub Pages:
# https://bmack.github.io/tryout/
#
# Two jobs, because they need different permissions: the first builds the site
# and uploads it, the second is the only thing allowed to deploy. Pull requests
# build (a dead link fails the build) but never deploy.
name: Documentation

on:
  push:
    branches: [main, feature/ddev-addon-ddev-subfolder]
    paths:
      - "docs/**"
      - ".github/workflows/publish.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

# A second push to a branch replaces the first. Deployments queue instead —
# a half-replaced site is worse than a site one commit behind.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated on every page comes from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run docs:build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/ddev-addon-ddev-subfolder')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - id: deploy
        uses: actions/deploy-pages@v4
