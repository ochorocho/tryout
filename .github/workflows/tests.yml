name: tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

  schedule:
    - cron: '25 08 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast suites: pure helpers, then install/config/removal. Every test in the
  # install suite costs a full DDEV project lifecycle, so the slow tests that
  # clone TYPO3 Core are sharded into their own job below.
  tests:
    name: ${{ matrix.suite }} (${{ matrix.ddev_version }}${{ matrix.gum == 'absent' && ', no gum' || '' }})
    strategy:
      matrix:
        ddev_version: [stable, HEAD]
        suite: [unit, install]
        gum: [present]
        # gum is optional, so one extra shard runs without it to prove the
        # plain-text fallback still passes — otherwise CI would only ever
        # exercise the styled path. This is `include` adding a combination, not
        # merging into one: it sets a value for `gum`, which the base matrix
        # already defines, so it cannot silently overwrite a existing job.
        include:
          - ddev_version: stable
            suite: unit
            gum: absent
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      # gum is optional — the ui_* helpers fall back to plain text without it.
      # Most jobs install it so the gum path is what CI exercises; the `unit`
      # suite additionally runs a gumless variant (see the matrix) to prove the
      # fallback, which is the path a user without gum actually gets.
      - name: Install gum
        if: matrix.gum != 'absent'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list >/dev/null
          sudo apt-get update && sudo apt-get install -y gum
          gum --version

      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          # An explicit test_command bypasses the action's automatic
          # `--filter-tags !release`, so exclude the release test here. It is
          # covered by the nightly schedule job below.
          test_command: |
            case "${{ matrix.suite }}" in
              unit)    bats tests/unit.bats ;;
              install) bats tests/test.bats --filter-tags '!release' ;;
            esac

  # Slow: clones TYPO3 Core, runs composer install and sets up a real TYPO3.
  # Minutes per test, so it is kept off the every-push path.
  #
  # Until the switch-over to the Rust binary, every lifecycle run happens twice:
  # once on the bash implementation, once with TRYOUT_IMPL=rust, which hands
  # each verb to a Linux build of tui/ (host and web container alike).
  lifecycle:
    name: lifecycle (${{ matrix.ddev_version }}, ${{ matrix.impl }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        ddev_version: [stable, HEAD]
        impl: [bash, rust]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      # gum is optional, but installing it means CI exercises the styled path.
      - name: Install gum
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list >/dev/null
          sudo apt-get update && sudo apt-get install -y gum
          gum --version

      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          test_command: |
            if [ "${{ matrix.impl }}" = rust ]; then
              sudo apt-get install -y musl-tools
              rustup target add x86_64-unknown-linux-musl
              (cd tui && cargo build --release --locked --target x86_64-unknown-linux-musl)
              mkdir -p tryout/bin
              cp tui/target/x86_64-unknown-linux-musl/release/tryout tryout/bin/tryout-linux-x86_64
              TRYOUT_IMPL=rust bats tests/lifecycle.bats
            else
              bats tests/lifecycle.bats
            fi

  # Browser tests: does each served worktree URL really render a frontend and log
  # into its backend? A URL returning 200 does not prove either. Gated like
  # lifecycle — scheduled and on demand only — because it clones Core, provisions a
  # project and downloads a browser. The bats suites are the every-push gate.
  #
  # Self-provisioned rather than via the add-on-test action: the browser suite lives
  # in tests/e2e (not shipped into a project), so the checkout is the working dir
  # and the project is created here, the same way tests/lifecycle.bats does.
  e2e:
    name: browser e2e (${{ matrix.ddev_version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install DDEV
        run: |
          curl -fsSL https://ddev.com/install.sh | bash
          mkcert -install 2>/dev/null || true

      - name: Provision a project with two served worktrees
        run: |
          set -e
          PROJECT="$RUNNER_TEMP/tryout-e2e"
          mkdir -p "$PROJECT" && cd "$PROJECT"
          ddev config --project-name=tryout-e2e --project-tld=ddev.site \
            --project-type=typo3 --docroot=TYPO3-Instances/primary/public --php-version=8.5
          ddev add-on get "$GITHUB_WORKSPACE"
          ddev start -y
          # A 13.4 secondary: renders a styleguide frontend and logs in, so the
          # multi-site checks have two real URLs to compare.
          ddev tryout worktree add v13 13.4
          ddev tryout worktree serve v13
          ddev restart -y
          echo "TRYOUT_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Run the browser suite
        working-directory: tests/e2e
        run: |
          set -e
          npm ci || npm install
          npx playwright install --with-deps chromium
          npx playwright test

  # The published release, checked nightly so a broken tag is caught even when
  # nobody pushes.
  release:
    name: install from release (${{ matrix.ddev_version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        ddev_version: [stable, HEAD]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      # gum is optional, but installing it means CI exercises the styled path.
      - name: Install gum
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list >/dev/null
          sudo apt-get update && sudo apt-get install -y gum
          gum --version

      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          test_command: bats tests/test.bats --filter-tags release
