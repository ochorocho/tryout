name: tests
on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**.md"

  schedule:
    - cron: '25 08 * * *'

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Enable remote debugging session
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast suites: pure helpers, then install/config/removal. Every test in the
  # install suite costs a full DDEV project lifecycle, so the slow tests that
  # clone TYPO3 Core are sharded into their own job below.
  tests:
    name: ${{ matrix.suite }} (${{ matrix.ddev_version }}, ${{ matrix.os }})
    strategy:
      matrix:
        # More runners (e.g. ubuntu-24.04-arm) are one word away: the build step
        # makes the binary for whatever architecture it runs on.
        os: [ubuntu-latest]
        ddev_version: [stable, HEAD]
        suite: [unit, install]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          # An explicit test_command bypasses the action's automatic
          # `--filter-tags !release`, so exclude the release test here. It is
          # covered by the nightly schedule job below.
          test_command: |
            case "${{ matrix.suite }}" in
              unit)    bats tests/unit.bats ;;
              # The binary is part of the payload: build it before installing.
              install) tui/scripts/build-linux.sh && bats tests/test.bats --filter-tags '!release' ;;
            esac

  # Slow: clones TYPO3 Core, runs composer install and sets up a real TYPO3.
  # Minutes per test, so it is kept off the every-push path.
  lifecycle:
    name: lifecycle (${{ matrix.ddev_version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        ddev_version: [stable, HEAD]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          test_command: tui/scripts/build-linux.sh && bats tests/lifecycle.bats

  # Browser tests: does each served worktree URL really render a frontend and log
  # into its backend? A URL returning 200 does not prove either. Gated like
  # lifecycle — scheduled and on demand only — because it clones Core, provisions a
  # project and downloads a browser. The bats suites are the every-push gate.
  #
  # Self-provisioned rather than via the add-on-test action: the browser suite lives
  # in tests/e2e (not shipped into a project), so the checkout is the working dir
  # and the project is created here, the same way tests/lifecycle.bats does.
  e2e:
    name: browser e2e (${{ matrix.ddev_version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install DDEV
        run: |
          curl -fsSL https://ddev.com/install.sh | bash
          mkcert -install 2>/dev/null || true

      - name: Provision a project with two served worktrees
        run: |
          set -e
          PROJECT="$RUNNER_TEMP/tryout-e2e"
          mkdir -p "$PROJECT" && cd "$PROJECT"
          ddev config --project-name=tryout-e2e --project-tld=ddev.site \
            --project-type=typo3 --docroot=TYPO3-Instances/primary/public --php-version=8.5
          "$GITHUB_WORKSPACE/tui/scripts/build-linux.sh"
          ddev add-on get "$GITHUB_WORKSPACE"
          ddev start -y
          # A 13.4 secondary: renders a styleguide frontend and logs in, so the
          # multi-site checks have two real URLs to compare.
          ddev tryout worktree add v13 13.4
          ddev tryout worktree serve v13
          ddev restart -y
          echo "TRYOUT_PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Run the browser suite
        working-directory: tests/e2e
        run: |
          set -e
          npm ci || npm install
          npx playwright install --with-deps chromium
          npx playwright test

  # The published release, checked nightly so a broken tag is caught even when
  # nobody pushes.
  release:
    name: install from release (${{ matrix.ddev_version }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        ddev_version: [stable, HEAD]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - uses: ddev/github-action-add-on-test@v2
        with:
          ddev_version: ${{ matrix.ddev_version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          debug_enabled: ${{ github.event.inputs.debug_enabled }}
          addon_repository: ${{ env.GITHUB_REPOSITORY }}
          addon_ref: ${{ env.GITHUB_REF }}
          test_command: bats tests/test.bats --filter-tags release
