<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="tryout">
  <title>tryout — every branch, served</title>
  <!-- A lab flask (it is a try-out) whose git branches bubble up out of its
       neck, each ending in a little browser window: one site per branch. -->
  <!-- branches: a git graph growing out of the neck -->
  <g fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round">
    <path d="M64 44 V22"/>
    <path d="M64 36 C64 28 40 30 34 20"/>
    <path d="M64 34 C64 26 88 28 94 18"/>
  </g>
  <!-- the sites at the tips: tiny browser windows -->
  <g stroke="#134e4a" stroke-width="2.5">
    <rect x="21" y="5" width="26" height="18" rx="3" fill="#fff7ed"/>
    <rect x="51" y="2" width="26" height="18" rx="3" fill="#fff7ed"/>
    <rect x="81" y="3" width="26" height="18" rx="3" fill="#fff7ed"/>
  </g>
  <g fill="#ff8700">
    <rect x="21" y="5" width="26" height="5" rx="2"/>
    <rect x="51" y="2" width="26" height="5" rx="2"/>
    <rect x="81" y="3" width="26" height="5" rx="2"/>
  </g>
  <g stroke="#134e4a" stroke-width="2" stroke-linecap="round">
    <path d="M26 15 H40 M26 19 H35"/>
    <path d="M56 12 H70 M56 16 H64"/>
    <path d="M86 13 H100 M86 17 H96"/>
  </g>
  <!-- the flask -->
  <path d="M54 46 H74 V60 L100 108 A8 8 0 0 1 93 120 H35 A8 8 0 0 1 28 108 L54 60 Z"
        fill="#ccfbf1" stroke="#134e4a" stroke-width="4" stroke-linejoin="round"/>
  <!-- what is being tried out -->
  <path d="M41 86 Q52 80 64 86 T87 86 L98 106 A6 6 0 0 1 93 115 H35 A6 6 0 0 1 30 106 Z"
        fill="#14b8a6"/>
  <rect x="50" y="42" width="28" height="7" rx="3.5" fill="#134e4a"/>
  <!-- bubbles on their way up -->
  <circle cx="58" cy="74" r="3" fill="#99f6e4" stroke="#134e4a" stroke-width="1.5"/>
  <circle cx="70" cy="66" r="2" fill="#99f6e4" stroke="#134e4a" stroke-width="1.5"/>
  <!-- and it is quite pleased about it -->
  <g fill="#134e4a">
    <ellipse cx="54" cy="98" rx="3.2" ry="4"/>
    <ellipse cx="74" cy="98" rx="3.2" ry="4"/>
  </g>
  <circle cx="55.2" cy="96.6" r="1.1" fill="#fff"/>
  <circle cx="75.2" cy="96.6" r="1.1" fill="#fff"/>
  <path d="M57 105 Q64 112 71 105" fill="none" stroke="#134e4a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fb923c" opacity=".7">
    <ellipse cx="46" cy="104" rx="3.5" ry="2"/>
    <ellipse cx="82" cy="104" rx="3.5" ry="2"/>
  </g>
</svg>
